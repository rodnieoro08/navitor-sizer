<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#071422" />
  <title>Navitor Vision Sizer</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="apple-touch-icon" href="./icon.svg" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo">NV</div>
      <div>
        <h1>Navitor Vision Sizer</h1>
        <div class="sub">Sizer + proctor case card · export to Notes</div>
      </div>
    </div>
    <div class="badge-row">
      <span class="pill">Not official Abbott software</span>
      <span class="pill warn">Heart Team decides</span>
    </div>
  </header>

  <main class="wrap">
    <section id="screen-input" class="screen active">
      <div class="card">
        <h2>Examples</h2>
        <div class="examples">
          <button type="button" data-ex="mid27">Straightforward 27</button>
          <button type="button" data-ex="edge66">Boundary 66 mm</button>
          <button type="button" data-ex="edge79">Boundary 79 mm</button>
        </div>
      </div>
      <div class="card">
        <h2>Annulus</h2>
        <p class="hint">Decision is perimeter and perimeter-derived diameter. Area and mean diameter are checks only.</p>
        <div class="grid-2">
          <div class="field"><label>Perimeter <span class="unit">mm</span></label><input id="peri" inputmode="decimal" placeholder="e.g. 74.2"></div>
          <div class="field"><label>Area <span class="unit">mm²</span></label><input id="area" inputmode="decimal" placeholder="e.g. 448"></div>
          <div class="field"><label>Perimeter-derived diameter <span class="unit">mm</span></label>
            <input id="periPD" inputmode="decimal" readonly placeholder="peri ÷ π">
          </div>
          <div class="field"><label>Min / max Ø</label>
            <div class="grid-2" style="gap:6px">
              <input id="minD" inputmode="decimal" placeholder="min">
              <input id="maxD" inputmode="decimal" placeholder="max">
            </div>
          </div>
          <div class="field"><label>Mean diameter <span class="unit">mm</span></label><input id="meanD" inputmode="decimal" placeholder="e.g. 24.1"></div>
        </div>
      </div>
      <div class="card">
        <h2>Root</h2>
        <div class="grid-2">
          <div class="field"><label>STJ diameter <span class="unit">mm</span></label><input id="stj" inputmode="decimal"></div>
          <div class="field"><label>SOV L / R / NC <span class="unit">mm</span></label>
            <div class="grid-3">
              <input id="sovL" inputmode="decimal" placeholder="L">
              <input id="sovR" inputmode="decimal" placeholder="R">
              <input id="sovNC" inputmode="decimal" placeholder="NC">
            </div>
          </div>
          <div class="field"><label>Or SOV min width only</label><input id="sovMin" inputmode="decimal" placeholder="if not split"></div>
          <div class="field"><label>LCA height <span class="unit">mm</span></label><input id="lca" inputmode="decimal"></div>
          <div class="field"><label>RCA height <span class="unit">mm</span></label><input id="rca" inputmode="decimal"></div>
          <div class="field"><label>LVOT Ø <span class="unit">mm</span></label><input id="lvot" inputmode="decimal"></div>
          <div class="field"><label>Ascending aorta <span class="unit">mm</span></label><input id="aa" inputmode="decimal"></div>
        </div>
      </div>
      <div id="mount-size"></div>
    </section>
    <section id="screen-case" class="screen"><div id="mount-case"></div></section>
    <section id="screen-result" class="screen"><div id="result-body" class="empty">Enter measurements and tap Recommend.</div></section>
    <section id="screen-charts" class="screen"><div id="mount-charts"></div></section>
    <section id="screen-logic" class="screen"><div id="mount-logic"></div></section>
  </main>
  <div id="mount-nav"></div>

  <script>
  (async function () {
    async function put(id, file) {
      const el = document.getElementById(id);
      const t = await (await fetch(file, { cache: "no-store" })).text();
      el.insertAdjacentHTML("beforeend", t);
    }
    try {
      await put("mount-size", "./frag-size-tail.html?v=25");
      await put("mount-case", "./frag-case-a.html?v=25");
      await put("mount-case", "./frag-case-b.html?v=25");
      await put("mount-charts", "./frag-charts.html?v=25");
      await put("mount-logic", "./frag-logic.html?v=25");
      await put("mount-nav", "./frag-nav.html?v=25");
    } catch (err) {
      console.error(err);
    }
    function add(src) {
      return new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src + (src.indexOf("http") === 0 ? "" : "?v=25");
        s.onload = res;
        s.onerror = rej;
        document.body.appendChild(s);
      });
    }
    await add("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
    await add("./app.js");
    await add("./case.js");
    await add("./ocr-strict.js");
    await add("./mensio-ocr.js");
    await add("./inrange-restore.js");
    await add("./result-fix.js");
    await add("./peri-pd.js");
    if (typeof init === "function") init();
  })();
  </script>
</body>
</html>
